name: Validation Tests

on:
  push:
    branches: [development, main, v0.9.0/development-branch-QSF, "*-candidate"]
  pull_request:
    branches: [development, main, v0.9.0/development-branch-QSF, "*-candidate"]

permissions:
  contents: read

jobs:
  merge_requirements_tests:
    strategy:
      fail-fast: false
      matrix:
        poetry-version: ["1.8.2"]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Poetry install
      uses: abatilo/actions-poetry@v2
      with:
        poetry-version: ${{ matrix.poetry-version }}

    - name: Install dependancies
      run: |-
        poetry install

    - name: Audit dependencies for known vulnerabilities
      # Non-blocking for now: a regression here should be visible without
      # failing the build until we've built confidence it isn't noisy.
      continue-on-error: true
      run: |-
        poetry run pip install pip-audit
        poetry run pip-audit

    - name: Test with pytest
      run: poetry run pytest --cov=instancespace --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: true

