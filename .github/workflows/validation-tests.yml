name: Validation Tests

on:
  # Validate every pull request, but avoid running the same head commit twice
  # as both a push and a pull_request event. Direct pushes still gate the
  # long-lived integration and release branches.
  push:
    branches:
    - main
    - development
    - "*-candidate"
    - "v*/development-*"
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: pyInstanceSpace

    env:
      MPLBACKEND: Agg
      LOKY_MAX_CPU_COUNT: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYIS_ALLOW_DIAGNOSTIC_FIXTURES: "0"
      PYIS_MATLAB_REFERENCE_BUNDLE: ${{ github.workspace }}/pyInstanceSpace/tests/fixtures/matlab/current
      PYTHONHASHSEED: "0"

    steps:
    - uses: actions/checkout@v6
      with:
        path: pyInstanceSpace
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Read approved MATLAB revision
      id: matlab_reference
      run: |
        python - <<'PY'
        import json, os, re
        from pathlib import Path
        commit = json.loads(Path("tests/fixtures/matlab/current/manifest.json").read_text())["matlab"]["repo_commit"]
        if not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
            raise ValueError("Invalid approved MATLAB commit")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"commit={commit}\n")
        PY

    - name: Check out approved MATLAB source
      uses: actions/checkout@v6
      with:
        repository: andremun/InstanceSpace
        ref: ${{ steps.matlab_reference.outputs.commit }}
        path: InstanceSpace
        persist-credentials: false

    - name: Install Poetry
      run: python -m pip install --disable-pip-version-check poetry==2.3.3

    - name: Install dependencies
      run: poetry install --sync --no-interaction

    - name: Validate lock file and package
      run: |-
        poetry check --lock
        poetry build

    - name: Check formatting, linting, and types
      run: |-
        poetry run ruff check --no-fix .
        poetry run black --check .
        poetry run mypy --strict .

    - name: Build docs site (checks numpy docstring format)
      run: poetry run poe docs

    - name: Verify MATLAB gold source and fixtures
      run: |-
        poetry run python -c 'import json, subprocess; from pathlib import Path; expected = json.loads(Path("tests/fixtures/matlab/current/manifest.json").read_text())["matlab"]["repo_commit"]; actual = subprocess.check_output(["git", "-C", "../InstanceSpace", "rev-parse", "HEAD"], text=True).strip(); assert actual == expected, f"MATLAB checkout mismatch: manifest={expected}, checkout={actual}"'
        poetry run python tools/fixture_provenance.py verify tests/fixtures/matlab/current
        poetry run python tools/fixture_provenance.py inventory . tests/fixture_inventory.json

    - name: Test with pytest
      run: poetry run pytest --strict-config --strict-markers -ra -W error --cov=instancespace --cov-report=term-missing

    - name: Audit dependencies for known vulnerabilities
      # Non-blocking for now: a regression here should be visible without
      # failing the build until we've built confidence it isn't noisy. Keep it
      # after the release gate so its ad-hoc install cannot perturb test deps.
      continue-on-error: true
      run: |-
        poetry run python -m pip install --upgrade pip pip-audit
        poetry run pip-audit

    - name: Test with pytest
      run: poetry run pytest --cov=instancespace --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: true

  matlab_freshness:
    # Upstream changes are a refresh signal, not a reproducibility gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Report changes on MATLAB master
      run: |
        python - <<'PY'
        import json, os, re, subprocess
        from pathlib import Path
        approved = json.loads(Path("tests/fixtures/matlab/current/manifest.json").read_text())["matlab"]["repo_commit"]
        remote = subprocess.check_output(["git", "ls-remote", "https://github.com/andremun/InstanceSpace.git", "refs/heads/master"], text=True, timeout=60)
        current = remote.split()[0]
        if not re.fullmatch(r"[0-9a-f]{40}", current):
            raise ValueError("Invalid MATLAB master revision")
        status = "Current" if approved == current else "Refresh candidate needed"
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write(f"### MATLAB reference freshness\n\n{status}\n\nApproved: `{approved}`\n\nMaster: `{current}`\n")
        if approved != current:
            print("::warning::MATLAB master has changed. Generate and review a candidate; do not update the approved pin alone.")
        PY
