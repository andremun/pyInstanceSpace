name: Validation Tests

on:
  # Validate every pull request, but avoid running the same head commit twice
  # as both a push and a pull_request event. Direct pushes still gate the
  # long-lived integration and release branches.
  push:
    branches:
    - main
    - development
    - "*-candidate"
    - "v*/development-*"
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: pyInstanceSpace

    env:
      MPLBACKEND: Agg
      LOKY_MAX_CPU_COUNT: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYIS_ALLOW_DIAGNOSTIC_FIXTURES: "0"
      PYIS_MATLAB_REFERENCE_BUNDLE: ${{ github.workspace }}/pyInstanceSpace/tests/fixtures/matlab/current
      PYTHONHASHSEED: "0"

    steps:
    - uses: actions/checkout@v6
      with:
        path: pyInstanceSpace
        persist-credentials: false

    - name: Check out current MATLAB gold source
      working-directory: .
      run: git clone --depth 1 --branch master https://github.com/andremun/InstanceSpace.git InstanceSpace

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: python -m pip install --disable-pip-version-check poetry==2.3.3

    - name: Install dependencies
      run: poetry install --sync --no-interaction

    - name: Validate lock file and package
      run: |-
        poetry check --lock
        poetry build

    - name: Check formatting, linting, and types
      run: |-
        poetry run ruff check --no-fix .
        poetry run black --check .
        poetry run mypy --strict .

    - name: Verify MATLAB gold source and fixtures
      run: |-
        poetry run python -c 'import json, subprocess; from pathlib import Path; expected = json.loads(Path("tests/fixtures/matlab/current/manifest.json").read_text())["matlab"]["repo_commit"]; actual = subprocess.check_output(["git", "-C", "../InstanceSpace", "rev-parse", "HEAD"], text=True).strip(); assert actual == expected, f"MATLAB oracle is stale: manifest={expected}, master={actual}"'
        poetry run python tools/fixture_provenance.py verify tests/fixtures/matlab/current
        poetry run python tools/fixture_provenance.py inventory . tests/fixture_inventory.json

    - name: Test with pytest
      run: poetry run pytest --strict-config --strict-markers -ra -W error --cov=instancespace --cov-report=term-missing

    - name: Audit dependencies for known vulnerabilities
      # Non-blocking for now: a regression here should be visible without
      # failing the build until we've built confidence it isn't noisy. Keep it
      # after the release gate so its ad-hoc install cannot perturb test deps.
      continue-on-error: true
      run: |-
        poetry run python -m pip install --upgrade pip pip-audit
        poetry run pip-audit

    - name: Test with pytest
      run: poetry run pytest --cov=instancespace --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: true

